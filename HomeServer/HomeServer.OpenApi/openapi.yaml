openapi: 3.0.1
info:
  title: TODO List Api
  version: 1.0.0
  description: Simple Api for tracking TODO items.

paths:
  /ai:
    # MARK: Get all chats.
    get:
      tags:
        - Chat
      operationId: GetAiChats
      description: Gets the IDs of all AI chats.
      responses:
        '200':
          description: Retrieves a collection of AI chat IDs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatInfoDto"

    # MARK: Posting a new chat.
    post:
      tags:
        - Chat
      operationId: PostAiChat
      description: Posts a new AI chat.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInfoDto"
      responses:
        '202':
          description: Created chat.
          content:
            application/json:
              schema:
                type: integer
                format: int32
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /ai/{id}:
    # MARK: Get AI chat by ID
    get:
      tags:
        - Chat
      operationId: GetAiChatById
      description: Gets an AI chat by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatContentDto"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

    # MARK: Post message to AI chat by ID
    post:
      tags:
        - Chat
      operationId: PostMessageToAiChatById
      description: Posts a message to an AI chat by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageContentDto"
      responses:
        '202':
          description: Created message.
          content:
            application/json:
              schema:
                type: integer
                format: int32
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

    # MARK: Delete an AI chat by ID
    delete:
      tags:
        - Chat
      operationId: DeleteAiChatById
      description: Deletes the AI chat with the given id.
      parameters:
       - name: id
         in: path
         required: true
         schema:
          type: integer
          format: int32
      responses:
        '204':
          description: No Content
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /todo:
    # MARK: Get all Tasks
    get:
      tags:
        - Task      
      operationId: GetTasks
      description: Gets the IDs of all tasks.
      responses:
        '200':
          description: Retrieves a collection of task Ids.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskInfoDto"

    # MARK: Post task
    post:
      tags:
        - Task
      operationId: PostTask
      description: Posts a task that needs to be completed.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostTaskInfoDto"
      responses:
        '202':
          description: Created task.
          content:
            application/json:
              schema:
                type: integer
                format: int32
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /todo/id/{id}:
    # MARK: Get by ID
    get:
      tags:
        - Task
      operationId: GetTaskById 
      description: Gets a todo item by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskInfoDto"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

    # MARK: Put by ID
    put:
      tags:
        - Task
      operationId: PutTaskById
      description: Alters the data held within a task.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutTaskInfoDto"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskInfoDto"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

    # MARK: Delete by ID
    delete:
      tags:
        - Task
      operationId: DeleteTaskById
      description: Deletes the task with the given id.
      parameters:
       - name: id
         in: path
         required: true
         schema:
          type: integer
          format: int32
      responses:
        '204':
          description: No Content
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

components:
  schemas:
    # MARK: Error Dto
    ErrorDto:
      type: object
      description: Error response to a given request.
      additionalProperties: false
      properties:
        message:
          type: array
          description: The error message.
          nullable: true
          items:
            type: string

    # MARK: Chat Info Dto
    ChatInfoDto:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int32
          description: The id of this chat.
        title:
          type: string
          description: The name of the chat.
        isDeleted:
          type: boolean
          description: Whether or not this chat is deleted.

    # MARK: Chat Content Dto
    ChatContentDto:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int32
          description: The id of this chat.
        title:
          type: string
          description: The name of the chat.
        isDeleted:
          type: boolean
          description: Whether or not this chat is deleted.
        messages:
          type: array
          description: All of the messages sent to and from the assistant.
          items:
            $ref: "#/components/schemas/MessageContentDto"

    # MARK: Message Content Dto
    MessageContentDto:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int32
          description: The id of this message.
        timestamp:
          type: string
          description: The timestamp of when this message was sent.
        message:
          type: string
          description: The content of the message.
        userRole:
          type: integer
          format: int32
          description: The role of the user who sent this message.

    # MARK: Task Info Dto
    TaskInfoDto:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int32
          description: The id of this task.
        title:
          type: string
          description: The name of the task.
        description:
          type: string
          description: A description of the task that needs to be completed.
        dueDate:
          type: string
          description: The due date of the task.
        estimatedTime:
          type: number
          format: float
          description: The estimated time in hours to complete this task.
        isComplete:
          type: boolean
          description: Whether or not this task is complete.
    # MARK: Task Info Post Dto
    PostTaskInfoDto:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          description: The name of the task.
        description:
          type: string
          description: A description of the task that needs to be completed.
        dueDate:
          type: string
          description: The due date of the task.
        estimatedTime:
          type: number
          format: float
          description: The estimated time in hours to complete this task.
        isComplete:
          type: boolean
          description: Whether or not this task is complete.
    # MARK: Put Task Info Dto
    PutTaskInfoDto:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          description: The name of the task.
        description:
          type: string
          description: A description of the task that needs to be completed.
        dueDate:
          type: string
          description: The due date of the task.
        estimatedTime:
          type: number
          format: float
          description: The estimated time in hours to complete this task.
        isComplete:
          type: boolean
          description: Whether or not this task is complete.
